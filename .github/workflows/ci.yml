name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci

      # Playwright E2E (TRD 7.2.2 step 5) runs against a live preview
      # deployment, not this job — there's no deployed environment to point
      # it at yet. Wire this in once Vercel preview deployments exist:
      # - run: npx playwright install --with-deps
      # - run: npm run test:e2e
      #   env:
      #     PLAYWRIGHT_BASE_URL: ${{ steps.vercel-preview.outputs.url }}
